# PURPOSE: Publish workflow that runs tests and publishes artifacts to Maven repositories on main branch pushes and version tags.
# PURPOSE: Publishes to the iterative-works Forgejo Maven registry on every push to main (snapshots) and on tags, and additionally to Maven Central (PGP-signed via Sonatype) on version tag pushes (releases).

name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: coursier/cache-action@v6

      - name: Run tests
        run: ./mill __.test

      - name: Run integration tests
        run: ./mill __.itest

      # Every push publishes to the forge's own Maven registry: a main push publishes the
      # current -SNAPSHOT, a vX.Y.Z tag publishes the release. MavenPublishModule detects
      # SNAPSHOT vs release from the version and routes accordingly — release and snapshot
      # URIs are the same Forgejo endpoint, which requires no PGP signature. Credentials are
      # iterative-works org-level Actions secrets; the org is public so reads are anonymous.
      - name: Publish to Forgejo Maven registry
        env:
          MILL_MAVEN_USERNAME: ${{ secrets.MILL_MAVEN_USERNAME }}
          MILL_MAVEN_PASSWORD: ${{ secrets.MILL_MAVEN_PASSWORD }}
        run: |
          ./mill mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts __:PublishModule.publishArtifacts \
            --releaseUri https://code.iterative.works/api/packages/iterative-works/maven \
            --snapshotUri https://code.iterative.works/api/packages/iterative-works/maven

      # Releases additionally go to Maven Central via Sonatype (PGP-signed). Tags only.
      - name: Publish to Maven Central
        if: github.ref_type == 'tag'
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
        run: ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --publishArtifacts __.publishArtifacts
